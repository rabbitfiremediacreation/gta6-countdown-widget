[package]
name = "gta6-countdown-widget"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gta6-countdown-widget"
path = "src/main.rs"

[[bin]]
name = "gta6-screensaver"
path = "src/bin/screensaver.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dependencies]
include_dir = "0.7.4"
muda = "0.21.2"
tao = "0.37.2"
wry = "0.57.2"
