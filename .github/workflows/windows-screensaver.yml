name: Windows screensaver
on:
  workflow_dispatch:
  push:
    tags: ['saver-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: gta6-widget
        run: cargo build --release --bin gta6-screensaver
      - name: Rename to .scr
        run: Copy-Item gta6-widget/target/release/gta6-screensaver.exe GTA6.scr
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-screensaver-windows
          path: GTA6.scr
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/saver-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" GTA6.scr --title "Screensaver for Windows" --notes "GTA6.scr: right-click, Install. Unsigned."
